[project]
name = "signin-window"
version = "0.4.0"
description = "Human sign-in windows, durable session maintenance and optional bounded browser challenges for self-hosted services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "benjamin-di" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "sign-in", "login", "novnc", "remote-browser", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4",
    "starlette>=0.40,<2",
    "websockets>=13",
]

[project.optional-dependencies]
automation = ["pydantic>=2.11,<3"]

[project.urls]
Homepage = "https://github.com/benjamin-di/signin-window"
Issues = "https://github.com/benjamin-di/signin-window/issues"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.14", "uvicorn>=0.30", "pydantic>=2.11,<3"]
# The paste add-on's browser test (tests/test_paste_dom.py): `uv sync --group browser`, then
# `uv run playwright install chromium`.
browser = ["playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signin_window"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Newer Starlette prefers httpx2 for its TestClient; httpx works with every supported version.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"examples/*" = ["S"]
"scripts/*" = ["S105", "S106"]  # test tokens
