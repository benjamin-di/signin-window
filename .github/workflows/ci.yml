name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: make check

  # The paste add-on in a real browser.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked --group browser
      - run: uv run --frozen playwright install --with-deps --only-shell chromium
      - run: uv run --frozen pytest tests/test_paste_dom.py

  # A link, its live view, paste and a hand-over, with Xvfb, x11vnc, noVNC and a real Chromium (scripts/e2e.py), on
  # Debian trixie: the base a login service image normally uses (Ubuntu 24.04's x11vnc injects no input on Xvfb).
  e2e:
    runs-on: ubuntu-latest
    container: python:3.12-slim-trixie
    timeout-minutes: 15
    env:
      NOVNC_VERSION: 1.6.0
      NOVNC_SHA256: 5066103959ef4e9b10f37e5a148627360dd8414e4cf8a7db92bdbd022e728aaa
      UV_LINK_MODE: copy
    steps:
      - name: Xvfb, x11vnc, noVNC and uv
        run: |
          apt-get update -q && apt-get install -y -q --no-install-recommends ca-certificates curl git xvfb x11vnc
          curl --fail --silent --show-error --location \
            "https://github.com/novnc/noVNC/archive/refs/tags/v${NOVNC_VERSION}.tar.gz" -o /tmp/novnc.tar.gz
          printf '%s  /tmp/novnc.tar.gz\n' "$NOVNC_SHA256" | sha256sum --check --status
          mkdir -p /tmp/novnc && tar -xzf /tmp/novnc.tar.gz -C /tmp/novnc --strip-components=1
          pip install --quiet uv
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: uv sync --locked --group browser
      - run: uv run --frozen playwright install --with-deps chromium
      - run: E2E_SHOTS=/tmp/e2e-shots NOVNC_DIR=/tmp/novnc timeout 600 uv run --frozen python scripts/e2e.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/e2e-shots
          retention-days: 7
