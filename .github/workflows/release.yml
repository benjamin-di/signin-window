name: Release
# A v1.2.3 tag: run the tests on the tagged commit, build the wheel and sdist, and publish a GitHub release with
# them (pypi.yml uploads the same tag to PyPI). Only the built-in token is used.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions: {}

# GitHub can deliver one tag push twice: the runs of a ref queue one behind the other, and a
# run whose tag already has a GitHub release (the last job) stops at `released`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          done=false
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            done=true
            echo "$TAG is already released: nothing to do"
          fi
          echo "done=$done" >> "$GITHUB_OUTPUT"

  ci:
    needs: released
    if: needs.released.outputs.done != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  github-release:
    needs: ci
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Build
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME is not version $version" >&2; exit 1; }
          uv build
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
